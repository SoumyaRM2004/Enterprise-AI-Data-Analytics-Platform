version: '3.9'

services:
  db:
    image: postgres:16
    container_name: analytics_db
    environment:
      POSTGRES_DB: analytics_platform
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - analytics_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d analytics_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: analytics_redis
    ports:
      - "6379:6379"
    networks:
      - analytics_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analytics_backend
    command: >
      bash -c "python manage.py migrate &&
               gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://analytics_user:analytics_pass@db:5432/analytics_platform
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=True
      - LLM_PROVIDER=openai_compatible
      - OPENAI_API_BASE=http://host.docker.internal:11434/v1
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USE_TLS=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - analytics_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analytics_celery
    command: celery -A config worker -l info --concurrency=4
    volumes:
      - ./backend:/app
      - media_data:/app/media
    environment:
      - DATABASE_URL=postgres://analytics_user:analytics_pass@db:5432/analytics_platform
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=True
      - LLM_PROVIDER=openai_compatible
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - analytics_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analytics_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://analytics_user:analytics_pass@db:5432/analytics_platform
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - analytics_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analytics_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    networks:
      - analytics_network

  nginx:
    image: nginx:alpine
    container_name: analytics_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - analytics_network

volumes:
  postgres_data:
  media_data:

networks:
  analytics_network:
    driver: bridge
